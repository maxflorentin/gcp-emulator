name: E2E (Terraform)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22"
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - name: Start emulator
        run: |
          go build -o bin/gcp-emulator ./cmd/server
          EMULATOR_DB="$RUNNER_TEMP/emulator.db" ./bin/gcp-emulator > "$RUNNER_TEMP/emulator.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fs http://localhost:8443/healthz >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/emulator.log"
          exit 1

      - name: Terraform apply / plan (no drift) / destroy
        run: e2e/run.sh

      - name: Emulator log
        if: failure()
        run: cat "$RUNNER_TEMP/emulator.log"
